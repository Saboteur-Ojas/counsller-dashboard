<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="vsContainerGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C2822"/>
      <stop offset="50%" stop-color="#141E19"/>
      <stop offset="100%" stop-color="#0E1612"/>
    </linearGradient>

    <linearGradient id="vsBridgeGold" x1="230" y1="320" x2="310" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="35%" stop-color="#EA9327"/>
      <stop offset="70%" stop-color="#F5B942"/>
      <stop offset="100%" stop-color="#FBD778"/>
    </linearGradient>

    <linearGradient id="vsBridgeUpper" x1="240" y1="280" x2="310" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
  </defs>

  <!-- Squircle Dark Container -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#vsContainerGrad)"/>
  <rect x="22" y="22" width="468" height="468" rx="122" stroke="#2C3D34" stroke-width="3.5" stroke-opacity="0.75" fill="none"/>

  <!-- Central VeerSetu "V" & "Setu" (Bridge) Symbol -->
  <g id="veersetu-symbol" transform="translate(0, 4)">
    <!-- 1. Left Wing (Clean Warm Ivory White) -->
    <path d="M 188 176 L 226 176 L 253 282 L 244 304 L 232 328 L 225 316 L 188 176 Z" fill="#F3F0E6"/>

    <!-- 2. Right Wing - Upper Olive/Sage segment -->
    <path d="M 296 176 L 326 176 L 305 236 C 290 238 274 245 261 254 L 274 228 L 296 176 Z" fill="#758850"/>

    <!-- 3. Right Wing - Lower Deep Forest Green segment -->
    <path d="M 244 354 L 232 328 C 248 300 274 274 294 258 L 297 248 L 244 354 Z" fill="#2A422F"/>

    <!-- 4. The Saffron-Gold Arching Bridge (Setu) -->
    <path d="M 231 292 C 240 270 262 248 306 237 C 290 248 266 276 244 330 C 238 316 234 304 231 292 Z" fill="url(#vsBridgeGold)"/>
    <path d="M 246 274 C 263 253 285 242 306 237 C 283 243 260 260 246 274 Z" fill="url(#vsBridgeUpper)"/>
  </g>
</svg>
